<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- <link rel='stylesheet' href='https://cdn.jsdelivr.net/gh/kognise/water.css@latest/dist/dark.css'> -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/yorha@1.2.0/dist/yorha.min.css" type="text/css">
    <link href="{{ url_for('static', filename='output.css') }}" rel="stylesheet">
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js" integrity="sha384-Akqfrbj/HpNVo8k11SXBb6TlBWmXXlYQrCSqEWmyKJe+hDm3Z/B2WVG4smwBkRVm" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script src="//unpkg.com/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <title>{% block title %} {% endblock %} - Flask App on PythonAnywhere</title>

</head>
<body>
  <div id="wrapper" class="clearfix">
    <!--start wrapper-->
         <div id="header" class="clearfix">
      <!--start header-->
      <div>
     <!--start navigation-->

      <div class="nav">
       <section class="empty" {!! $attributes ?? '' !!}>
       <div class="container flex flex-col flex-wrap items-center justify-between py-5 mx-auto md:flex-row max-w-7xl">
        <div class="relative flex flex-col md:flex-row">
            <a href="/" class="flex items-center mb-5 font-medium text-gray-900 lg:w-auto lg:items-center lg:justify-center md:mb-0">
                <span class="mx-auto text-xl font-black leading-none text-gray-900 select-none">bountystash<span class="text-indigo-600" data-primary="indigo-600">.</span></span>
            </a>
            <nav class="flex flex-wrap items-center mb-5 text-base md:mb-0 md:pl-8 md:ml-8 md:border-l md:border-gray-200">
                <a href="/" class="mr-5 font-medium leading-6 text-gray-600 hover:text-gray-900"
                    hx-post="/"
                    hx-trigger="click"
                    hx-target="#wrapper"
                    hx-swap="outerHTML"
                    hx-boost-immediate="true"
                >Home</a>
                <a href="/aipage" class="mr-5 font-medium leading-6 text-gray-600 hover:text-gray-900"
                    hx-post="/aipage"
                    hx-trigger="click"
                    hx-target="#wrapper"
                    hx-swap="outerHTML"
                    hx-boost-immediate="true"
                >AI</a>
                <a href="/shell" class="mr-5 font-medium leading-6 text-gray-600 hover:text-gray-900"
                    hx-post="/shell"
                    hx-trigger="click"
                    hx-target="#wrapper"
                    hx-swap="outerHTML"
                    hx-boost-immediate="true"
                >Shell</a>
                <a href="/blog" class="mr-5 font-medium leading-6 text-gray-600 hover:text-gray-900"
                    hx-post="/blog"
                    hx-trigger="click"
                    hx-target="#wrapper"
                    hx-swap="outerHTML"
                    hx-boost-immediate="true"
                >Blog</a>
            </nav>
        </div>

        <!-- <div class="inline-flex items-center ml-5 space-x-6 lg:justify-end"> -->
        <!--     <a href="#" class="text-base font-medium leading-6 text-gray-600 whitespace-no-wrap transition duration-150 ease-in-out hover:text-gray-900"> -->
        <!--         Sign in -->
        <!--     </a> -->
        <!--     <a href="#" class="empty" > -->
        <!--         Sign up -->
        <!--     </a> -->
        <!-- </div> -->
    </div>
</section>
      </div>
      <!--end navigation-->
       <!--end header-->
      <div class="container">
        {% for message in get_flashed_messages() %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
        {% block content %} {% endblock %}
      </div>
    </div>
      <div id="footer">
      <!--start footer-->
    <section class="empty" {!! $attributes ?? '' !!}>
    <div class="container flex flex-col items-center px-8 py-8 mx-auto max-w-7xl sm:flex-row">
        <a href="/" class="text-xl font-black leading-none text-gray-900 select-none logo">bountystash<span class="text-indigo-600">.</span></a>
        <p class="mt-4 text-sm text-gray-500 sm:ml-4 sm:pl-4 sm:border-l sm:border-gray-200 sm:mt-0">&copy; 2025 
        </p>
	<span class="inline-flex justify-center mt-4 space-x-5 sm:ml-auto sm:mt-0 sm:justify-start">
	<a href="https://github.com/shaoyanji/pythonanywhere" class="text-gray-400 hover:text-gray-500">
		<span class="sr-only">GitHub</span>

            </a>

    </div>
</section>

  </div>

</html>
