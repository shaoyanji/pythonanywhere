<section class="panel stack">
  <p class="eyebrow">Experiment Demo</p>
  <h1>Kelly Criterion calculator</h1>
  <p class="lede">This bounded demo keeps the original in-page calculator feel: change values, fetch JSON, patch the result, stay on the same page shell.</p>
  <form
    class="admin-form"
    action="{{ url_for('experiments_demo.wasm_kelly_demo') }}"
    method="get"
    url="{{ url_for('experiments_demo.wasm_kelly_calculate') }}"
    fn="oninput"
  >
    <label>Probability <input type="number" step="1" min="0" max="100" name="probability" value="{{ values.probability }}"></label>
    <label>Reward <input type="number" step="0.01" min="0" name="reward" value="{{ values.reward }}"></label>
    <label>Risk <input type="number" step="0.01" min="0" name="risk" value="{{ values.risk }}"></label>
    <button type="submit">Calculate</button>
  </form>
  <div id="demo-result">
    {% include "partials/public/demo_result.html" %}
  </div>
</section>
