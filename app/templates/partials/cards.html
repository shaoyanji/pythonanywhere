{% macro post_card(post) -%}
  <article class="card card-post">
    <p class="eyebrow">Note</p>
    <h3><a href="{{ url_for('public.note_detail', slug=post.slug) }}">{{ post.title }}</a></h3>
    <p>{{ post.excerpt }}</p>
  </article>
{%- endmacro %}

{% macro experiment_card(experiment) -%}
  <article class="card card-experiment">
    <p class="eyebrow">Experiment</p>
    <h3><a href="{{ url_for('public.experiment_detail', slug=experiment.slug) }}">{{ experiment.title }}</a></h3>
    <p>{{ experiment.summary }}</p>
    {% if experiment.demo_path %}
      <p class="card-meta">Demo: <a href="{{ experiment.demo_path }}">{{ experiment.demo_path }}</a></p>
    {% endif %}
  </article>
{%- endmacro %}
