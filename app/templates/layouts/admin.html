<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Admin | {{ app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <aside class="admin-rail">
        <a class="admin-mark" href="{{ url_for('admin.admin_index') }}">admin</a>
        <nav class="admin-nav">
          <a href="{{ url_for('admin.admin_index') }}">Overview</a>
          <a href="{{ url_for('admin.admin_content') }}">Content</a>
          <a href="{{ url_for('admin.admin_prompts') }}">Prompt Runs</a>
          <a href="{{ url_for('admin.admin_deploy') }}">Deploy</a>
          <a href="{{ url_for('public.home') }}">Back to site</a>
        </nav>
      </aside>
      <main class="admin-main">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-stack">
              {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
