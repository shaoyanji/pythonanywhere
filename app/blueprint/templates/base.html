
{% extends 'layout.html' %}
{% block head %}
	<script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
{% endblock %}
{% block nav %}
        {% for item in navigation %}
        <a href="{{ item.href }}"
            hx-post="{{ item.href }}"
            hx-trigger="mousedown"
			hx-target="body"
			hx-swap="innerHTML"
			hx-boost-immediate="true"
            hx-replace-url="true"
            >{{ item.caption }}</a><br>
        {% endfor %}
{% endblock %}
