# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - task $(cat Taskfile.yml | yq '.tasks | keys.[]' | fzf)
    silent: true
  install-tailwind:
    cmds:
      - npm install tailwindcss @tailwindcss/cli
    silent: true
  run-tailwind:
    cmds:
      - echo '@import "tailwindcss";' > ./static/input.css
      - npx @tailwindcss/cli -i ./static/input.css -o ./static/output.css --watch
    silent: true
  exit:
    cmds:
      - exit
