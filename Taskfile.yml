# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - task $(cat Taskfile.yml | yq '.tasks | keys|.[]'| awk -F'"' '{for(i=1;i<=NF;i++) printf "%s%s", (i>1?" ":""), $i; print ""}' | fzf)
    silent: true
  webappreload:
    cmds:
      - pa webapp reload

  gitbackup:
    cmds:
      - git add . 
      - git commit -m "task update"
      - git push 
  install-tailwind:
    cmds:
      - npm install tailwindcss @tailwindcss/cli
    silent: true
  run-tailwind:
    cmds:
      - echo '@import "tailwindcss";' > ./static/input.css
      - npx @tailwindcss/cli -i ./static/input.css -o ./static/output.css --watch
    silent: true
  install-python-deps:
    cmds:
      - pip install -r requirements.txt
  exit:
    cmds:
      - exit
